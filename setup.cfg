[flake8]
max-line-length = 100
select = W,B,F,E711,E712,E901
extend-ignore = E203,B005,F811,F821,F403,F405,W503
exclude = .git,.eggs,__pycache__,build,dist,venv
max-complexity = 11

[tool:pytest]
testpaths = tests
asyncio_mode = auto

[coverage:run]
source = custom_components/aigues_barcelona
omit =
    tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
